<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Mango</title>
  <desc id="desc">Mango, a fluffy black cat with tufted ears, golden eyes, a white bib, white paws and long white whiskers, sits tall on a blue knitted cushion in front of a glowing moon, under a night sky with twinkling stars.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1c40"/>
      <stop offset="0.55" stop-color="#1c1429"/>
      <stop offset="1" stop-color="#3a1f33"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffe3a3"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f2862b"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a95d8"/>
      <stop offset="1" stop-color="#2c4c8a"/>
    </linearGradient>
    <pattern id="knit" width="14" height="11" patternUnits="userSpaceOnUse">
      <path d="M 1.5 1.5 L 7 9 M 12.5 1.5 L 7 9" stroke="#9cbcec" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M 2.5 3.5 L 7 9.8 M 11.5 3.5 L 7 9.8" stroke="#24406f" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="400" rx="28"/></clipPath>
  </defs>
  <style>
    .star { animation: twinkle 4s ease-in-out infinite; }
    .s2 { animation-delay: 1.3s; }
    .s3 { animation-delay: 2.6s; }
    .heart { animation: float 5s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes float { 0%, 100% { transform: translateY(0); opacity: 0.9; } 50% { transform: translateY(-8px); opacity: 0.6; } }
    @media (prefers-reduced-motion: reduce) { .star, .heart { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#sky)"/>

    <g fill="#fff1d6">
      <circle class="star" cx="80" cy="60" r="2.5"/>
      <circle class="star s2" cx="170" cy="120" r="1.8"/>
      <circle class="star s3" cx="540" cy="48" r="2.2"/>
      <circle class="star" cx="575" cy="372" r="1.6"/>
      <circle class="star s2" cx="1010" cy="70" r="2.4"/>
      <circle class="star s3" cx="1120" cy="150" r="1.8"/>
      <circle class="star s2" cx="1150" cy="340" r="2"/>
      <circle class="star s3" cx="60" cy="300" r="1.8"/>
      <path class="star s2" d="M 1160 250 l 3 9 l 9 3 l -9 3 l -3 9 l -3 -9 l -9 -3 l 9 -3 z"/>
      <path class="star" d="M 120 190 l 2.5 7 l 7 2.5 l -7 2.5 l -2.5 7 l -2.5 -7 l -7 -2.5 l 7 -2.5 z"/>
    </g>

