<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Mango</title>
  <desc id="desc">A fluffy black cat with mango-orange eyes sits on a pink cushion in front of a glowing mango-coloured moon, under a night sky with twinkling stars.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1c40"/>
      <stop offset="0.55" stop-color="#1c1429"/>
      <stop offset="1" stop-color="#3a1f33"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffe3a3"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f2862b"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a8c8"/>
      <stop offset="1" stop-color="#d96f9c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="fur" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="400" rx="28"/></clipPath>
  </defs>
  <style>
    .star { animation: twinkle 4s ease-in-out infinite; }
    .s2 { animation-delay: 1.3s; }
    .s3 { animation-delay: 2.6s; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; }
    .tail { transform-origin: 398px 338px; animation: swish 3.2s ease-in-out infinite; }
    .heart { animation: float 5s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes swish { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(9deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0); opacity: 0.9; } 50% { transform: translateY(-8px); opacity: 0.6; } }
    @media (prefers-reduced-motion: reduce) { .star, .eyes, .tail, .heart { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#sky)"/>

    <g fill="#fff1d6">
      <circle class="star" cx="80" cy="60" r="2.5"/>
      <circle class="star s2" cx="170" cy="120" r="1.8"/>
      <circle class="star s3" cx="540" cy="48" r="2.2"/>
      <circle class="star" cx="640" cy="330" r="1.6"/>
      <circle class="star s2" cx="1010" cy="70" r="2.4"/>
      <circle class="star s3" cx="1120" cy="150" r="1.8"/>
      <circle class="star s2" cx="1150" cy="340" r="2"/>
      <circle class="star s3" cx="60" cy="300" r="1.8"/>
      <path class="star s2" d="M 1160 250 l 3 9 l 9 3 l -9 3 l -3 9 l -3 -9 l -9 -3 l 9 -3 z"/>
      <path class="star" d="M 120 190 l 2.5 7 l 7 2.5 l -7 2.5 l -2.5 7 l -2.5 -7 l -7 -2.5 l 7 -2.5 z"/>
    </g>

    <circle cx="330" cy="200" r="165" fill="#ffb347" opacity="0.35" filter="url(#glow)"/>
    <circle cx="330" cy="200" r="150" fill="url(#moon)"/>

    <ellipse cx="330" cy="372" rx="150" ry="30" fill="url(#cushion)"/>
    <ellipse cx="330" cy="362" rx="128" ry="16" fill="#f9bcd5" opacity="0.6"/>

    <g filter="url(#fur)" fill="#120e16">
      <path class="tail" d="M 398 338 C 470 345 500 290 468 246" stroke="#120e16" stroke-width="26" stroke-linecap="round" fill="none"/>
      <ellipse cx="330" cy="292" rx="90" ry="76"/>
      <circle cx="330" cy="188" r="64"/>
      <circle cx="282" cy="208" r="30"/>
      <circle cx="378" cy="208" r="30"/>
      <path d="M 272 158 L 280 92 L 322 134 Z"/>
      <path d="M 388 158 L 380 92 L 338 134 Z"/>
      <ellipse cx="300" cy="356" rx="24" ry="13"/>
      <ellipse cx="360" cy="356" rx="24" ry="13"/>
    </g>
    <path d="M 284 140 L 288 108 L 308 130 Z" fill="#5a2a44"/>
    <path d="M 376 140 L 372 108 L 352 130 Z" fill="#5a2a44"/>

    <g class="eyes">
      <ellipse cx="305" cy="186" rx="14" ry="11" fill="#ffb740"/>
      <ellipse cx="355" cy="186" rx="14" ry="11" fill="#ffb740"/>
      <ellipse cx="305" cy="186" rx="3.5" ry="9" fill="#120e16"/>
      <ellipse cx="355" cy="186" rx="3.5" ry="9" fill="#120e16"/>
      <circle cx="309" cy="182" r="2.4" fill="#fff6e6"/>
      <circle cx="359" cy="182" r="2.4" fill="#fff6e6"/>
    </g>
    <circle cx="288" cy="208" r="8" fill="#f7a1c4" opacity="0.28"/>
    <circle cx="372" cy="208" r="8" fill="#f7a1c4" opacity="0.28"/>
    <path d="M 324 204 L 336 204 L 330 211 Z" fill="#f7a1c4"/>
    <g stroke="#fff1d6" stroke-width="1.6" stroke-linecap="round" opacity="0.55" fill="none">
      <path d="M 300 212 Q 268 206 238 200"/>
      <path d="M 300 218 Q 268 220 240 226"/>
      <path d="M 360 212 Q 392 206 422 200"/>
      <path d="M 360 218 Q 392 220 420 226"/>
    </g>

    <g class="heart">
      <path d="M 452 150 c -6 -10 -22 -6 -20 6 c 2 10 20 20 20 20 c 0 0 18 -10 20 -20 c 2 -12 -14 -16 -20 -6 z" fill="#f7a1c4"/>
    </g>

    <g transform="translate(500 350)">
      <ellipse cx="0" cy="0" rx="22" ry="17" fill="#ffb347" transform="rotate(-20)"/>
      <path d="M 6 -15 q 14 -14 26 -6 q -12 10 -26 6 z" fill="#8fd694"/>
    </g>

    <text x="620" y="170" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', 'Segoe UI', system-ui, sans-serif" font-size="112" font-weight="800" fill="url(#name)">Mango</text>
    <text x="624" y="218" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', 'Segoe UI', system-ui, sans-serif" font-size="27" fill="#fff1d6">a fluffy black cat who lives</text>
    <text x="624" y="252" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', 'Segoe UI', system-ui, sans-serif" font-size="27" fill="#fff1d6">above your Claude Code prompt</text>

    <rect x="620" y="282" width="480" height="76" rx="14" fill="#0f0b14" opacity="0.75"/>
    <g font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="20" style="white-space: pre">
      <text x="640" y="313" fill="#ffb347">&#160;/\_/\</text>
      <text x="640" y="341" fill="#ffb347">( o.o ) ~<tspan fill="#fff1d6" dx="16">Mango blinks slowly at you.</tspan></text>
    </g>
  </g>
</svg>
