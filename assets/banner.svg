    <circle cx="330" cy="200" r="150" fill="url(#moon)"/>

    <ellipse cx="330" cy="364" rx="166" ry="36" fill="url(#cushion)"/>
    <ellipse cx="330" cy="364" rx="166" ry="36" fill="url(#knit)" opacity="0.75"/>
    <ellipse cx="330" cy="342" rx="138" ry="12" fill="#a9c5f0" opacity="0.35"/>

