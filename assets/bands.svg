<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 562" width="1200" height="562" role="img" aria-labelledby="btitle bdesc">
  <title id="btitle">Mango above the prompt</title>
  <desc id="bdesc">Two views of the band above the prompt. In the desktop Code tab, a drawing of Mango with a sparkle says: Mango purrs at the green run. In the terminal, her ASCII face with flattened ears says: Mango knocks the error off the table.</desc>
  <style>@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}@keyframes deep{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-0.8px)}}@keyframes sink{0%,100%{transform:translateY(0)}50%{transform:translateY(1.2px)}}@keyframes blink{0%,44%,48%,86%,89%,92%,100%{transform:scaleY(1)}46%,87.5%,90.5%{transform:scaleY(0.1)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}@keyframes flick{0%,100%{transform:rotate(0)}25%{transform:rotate(16deg)}55%{transform:rotate(-8deg)}}@keyframes shiver{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}@keyframes twitch-l{0%,58%,66%,100%{transform:rotate(0)}61%{transform:rotate(-14deg)}}@keyframes twitch-r{0%,22%,30%,100%{transform:rotate(0)}25%{transform:rotate(14deg)}}@keyframes knead{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes drift{0%{opacity:0;transform:translate(0,3px)}25%{opacity:1}100%{opacity:0;transform:translate(14px,-18px)}}@keyframes twinkle{0%,100%{opacity:0.6;transform:scale(0.75) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}@keyframes drip{0%{opacity:0;transform:translateY(-2px)}20%{opacity:1}100%{opacity:0;transform:translateY(7px)}}@keyframes glance{0%,20%,90%,100%{transform:translateX(0)}30%,50%{transform:translateX(-2px)}60%,80%{transform:translateX(2px)}}@keyframes love{0%{opacity:0;transform:translateY(4px) scale(0.6)}25%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-8px) scale(1)}}.body{transform-origin:52px 94px}.tail{transform-origin:78px 82px}.eyes,.look{transform-origin:52px 40px}.ear-l,.perk-l{transform-origin:38px 30px}.ear-r,.perk-r{transform-origin:66px 30px}.mark{transform-origin:103px 22px}.heart{transform-origin:90px 16px}.perk-l,.perk-r,.look{transition:transform 0.25s ease-out}.m-awake .body{animation:breathe 3.2s ease-in-out infinite}.m-awake .head{animation:bob 3.2s ease-in-out infinite}.m-awake .tail{animation:sway 4.4s ease-in-out infinite}.m-awake .eyes{animation:blink 6.8s linear infinite}.m-awake .ear-l{animation:twitch-l 9s ease-in-out infinite}.m-awake .ear-r{animation:twitch-r 11s ease-in-out infinite}.m-working .body{animation:breathe 3.2s ease-in-out infinite}.m-working .head{animation:bob 3.2s ease-in-out infinite}.m-working .tail{animation:sway 2.6s ease-in-out infinite}.m-working .eyes{animation:blink 6.8s linear infinite}.m-working .ear-l{animation:twitch-l 9s ease-in-out infinite}.m-working .ear-r{animation:twitch-r 11s ease-in-out infinite}.m-working .paw-l{animation:knead 0.9s ease-in-out infinite}.m-working .paw-r{animation:knead 0.9s ease-in-out -0.45s infinite}.m-proud .body{animation:breathe 3.2s ease-in-out infinite}.m-proud .head{animation:bob 3.2s ease-in-out infinite}.m-proud .tail{animation:sway 3.6s ease-in-out infinite}.m-proud .mark{animation:twinkle 1.6s ease-in-out infinite}.m-sleeping .body{animation:deep 5s ease-in-out infinite}.m-sleeping .head{animation:sink 5s ease-in-out infinite}.m-sleeping .ear-r{animation:twitch-r 13s ease-in-out infinite}.m-sleeping .z{animation:drift 3.6s ease-out infinite}.m-sleeping .z2{animation-delay:-1.2s}.m-sleeping .z3{animation-delay:-2.4s}.m-ruffled .body{animation:breathe 1.6s ease-in-out infinite}.m-ruffled .head{animation:bob 1.6s ease-in-out infinite}.m-ruffled .tail{animation:flick 0.9s ease-in-out infinite}.m-ruffled .mark{animation:pulse 0.6s ease-in-out infinite}.m-worried .body{animation:breathe 2.2s ease-in-out infinite}.m-worried .head{animation:bob 2.2s ease-in-out infinite}.m-worried .tail{animation:shiver 1.2s ease-in-out infinite}.m-worried .eyes{animation:blink 6.8s linear infinite}.m-worried .pupil{animation:glance 4s ease-in-out infinite}.m-worried .mark{animation:drip 2.4s ease-in infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.z2{transform:translate(7px,-8px)}.z3{transform:translate(14px,-16px)}}</style>
