# Ward baseline, written by the ward skill from the stacks in this repo.
# Majors are never grouped, so each gets its own PR for me to read. Every block
# waits 21 days before it proposes a major, so a broken x.0.0 is fixed by then.
version: 2
updates:
  # GitHub's own actions are grouped and may auto-merge. Ward's two pins arrive
  # together and merge only when both move to a Ward release tag. Every other
  # action gets its own PR for me to read.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 21
    groups:
      actions-first-party:
        patterns:
          - "actions/*"
          - "github/*"
          - "dependabot/*"
        update-types: [minor, patch]
      ward:
        patterns:
          - "malinfossum/ward*"
